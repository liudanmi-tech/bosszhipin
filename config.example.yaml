# 复制为 config.yaml 后填写（config.yaml 已被 .gitignore 排除）

# 你的简历纯文本（或用 resume_file 指向一个 .md/.txt 文件）
resume_file: resume/resume.md

# 求职偏好：大模型据此给职位打分
preferences:
  keywords: ["AI 产品经理", "大模型"]
  cities: ["北京", "上海"]
  salary_min_k: 30          # 月薪下限（K）
  must_have: ["大模型", "AI"]
  avoid: ["外包", "驻场", "销售"]
  notes: "偏好成长期公司，不考虑 996"

# 大模型（OpenAI 兼容接口，默认 OpenRouter）
llm:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY   # 从该环境变量读取 key
  model: anthropic/claude-sonnet-5.5
  match_threshold: 75               # 打分 >= 该值才进入投递候选

# 安全限速：防止触发平台风控
safety:
  daily_apply_limit: 30             # 每个平台每天最多投递数
  min_delay_sec: 4                  # 每次操作之间随机延时
  max_delay_sec: 12
  require_confirm: true             # 投递/发消息前在终端人工确认

# 启用的平台
platforms: [boss, liepin, maimai]
